# =============================================================================
# Snakemake >=8 SLURM profile for the CNVkit WGS pipeline
# =============================================================================
# Mirrors ~/IMP/Profiles/profile_snakemake/config.v8+.yaml, but carries the
# per-rule resources of THIS pipeline (they used to live in config.yaml).
#
# Usage:
#   bash run_pipeline.sh                      # uses this profile by default
#   snakemake --profile profiles/slurm ...    # equivalent, by hand
#
# mem_mb / runtime are Python expressions evaluated per attempt, so a job that
# fails gets resubmitted with doubled memory and runtime, capped:
#     min(BASE * (2 ** (attempt - 1)), CAP)
# runtime is in minutes.
#
# NOTE on partitions: the snakemake SLURM executor plugin reads the resource
# 'slurm_partition' — a plain 'partition' key is silently ignored.  'qos' IS
# read as a job resource.
# CBE.next (verified on the cluster 2026-11-13): partitions are
#     c  (default; 192 cores / ~754 GB per node)
#     g  (GPU)
#     m  (~7.9 TB; only sensible for mem_mb >= ~700000)
# QOS tiers are named '<partition>_<tier>' (c_rapid, c_short, c_medium,
# c_long, ...), with the familiar wall limits (rapid 1h, short 8h,
# medium 2d, long 14d).  No rule here approaches the m-node memory
# threshold, so everything runs on partition c and only the QOS tier is
# derived from the runtime expression:
#     rapid <= 60 min, short <= 480 min, medium <= 2880 min, long above.
# =============================================================================

executor: slurm

default-resources:
  slurm_account: "${SLURM_ACCOUNT}"
  nodes: 1
  mem_mb: "min(20000 * (2 ** (attempt - 1)), 40000)"
  runtime: "min(60 * (2 ** (attempt - 1)), 120)"
  threads: 1
  qos: "('c_' + ('rapid' if min(60 * (2 ** (attempt - 1)), 120) <= 60 else 'short' if min(60 * (2 ** (attempt - 1)), 120) <= 480 else 'medium' if min(60 * (2 ** (attempt - 1)), 120) <= 2880 else 'long'))"
  slurm_partition: c

set-resources:
  # ─── binning ───────────────────────────────────────────────────────────────
  access:
    mem_mb: "min(8000 * (2 ** (attempt - 1)), 32000)"
    runtime: "min(60 * (2 ** (attempt - 1)), 240)"
    threads: 1
  autobin:
    mem_mb: "min(16000 * (2 ** (attempt - 1)), 64000)"
    runtime: "min(60 * (2 ** (attempt - 1)), 240)"
    threads: 1

  # ─── coverage: the heavy step, one job per sample ───────────────────────────
  coverage:
    mem_mb: "min(32000 * (2 ** (attempt - 1)), 120000)"
    runtime: "min(360 * (2 ** (attempt - 1)), 1440)"
    threads: 8
    # The retry runtime exceeds the default-derived c_short tier (8 h), so the
    # QOS tier is re-derived from THIS rule's runtime expression:
    #   attempt 1: 360 min -> c_short, attempt 2: 720 min -> c_medium,
    #   attempt 3: 1440 min -> c_medium (2 d wall).
    slurm_partition: c
    qos: "('c_' + ('rapid' if min(360 * (2 ** (attempt - 1)), 1440) <= 60 else 'short' if min(360 * (2 ** (attempt - 1)), 1440) <= 480 else 'medium' if min(360 * (2 ** (attempt - 1)), 1440) <= 2880 else 'long'))"

  # ─── references ────────────────────────────────────────────────────────────
  build_flat_reference:
    mem_mb: "min(16000 * (2 ** (attempt - 1)), 64000)"
    runtime: "min(60 * (2 ** (attempt - 1)), 240)"
    threads: 1
  build_normal_reference:
    mem_mb: "min(16000 * (2 ** (attempt - 1)), 64000)"
    runtime: "min(60 * (2 ** (attempt - 1)), 240)"
    threads: 1
  build_sample_reference:
    mem_mb: "min(16000 * (2 ** (attempt - 1)), 64000)"
    runtime: "min(60 * (2 ** (attempt - 1)), 240)"
    threads: 1

  # ─── per-sample calling ────────────────────────────────────────────────────
  fix:
    mem_mb: "min(8000 * (2 ** (attempt - 1)), 32000)"
    runtime: "min(30 * (2 ** (attempt - 1)), 120)"
    threads: 1
  segment:
    mem_mb: "min(16000 * (2 ** (attempt - 1)), 64000)"
    runtime: "min(120 * (2 ** (attempt - 1)), 480)"
    threads: 1
    # 480 min sits exactly at the c_short wall (8 h); derive the tier from
    # this rule's own runtime so a raised cap re-routes to c_medium.
    slurm_partition: c
    qos: "('c_' + ('rapid' if min(120 * (2 ** (attempt - 1)), 480) <= 60 else 'short' if min(120 * (2 ** (attempt - 1)), 480) <= 480 else 'medium' if min(120 * (2 ** (attempt - 1)), 480) <= 2880 else 'long'))"
  call:
    mem_mb: "min(4000 * (2 ** (attempt - 1)), 16000)"
    runtime: "min(30 * (2 ** (attempt - 1)), 120)"
    threads: 1
  genemetrics:
    mem_mb: "min(4000 * (2 ** (attempt - 1)), 16000)"
    runtime: "min(30 * (2 ** (attempt - 1)), 120)"
    threads: 1
  genelist:
    mem_mb: "min(2000 * (2 ** (attempt - 1)), 8000)"
    runtime: "min(15 * (2 ** (attempt - 1)), 60)"
    threads: 1

  # ─── plots ─────────────────────────────────────────────────────────────────
  scatter:
    mem_mb: "min(8000 * (2 ** (attempt - 1)), 32000)"
    runtime: "min(60 * (2 ** (attempt - 1)), 240)"
    threads: 1
  diagram:
    mem_mb: "min(8000 * (2 ** (attempt - 1)), 32000)"
    runtime: "min(60 * (2 ** (attempt - 1)), 240)"
    threads: 1
  heatmap_vs_reference:
    mem_mb: "min(16000 * (2 ** (attempt - 1)), 64000)"
    runtime: "min(60 * (2 ** (attempt - 1)), 240)"
    threads: 1
  heatmap_vs_normal:
    mem_mb: "min(16000 * (2 ** (attempt - 1)), 64000)"
    runtime: "min(60 * (2 ** (attempt - 1)), 240)"
    threads: 1

  # ─── summary reports ───────────────────────────────────────────────────────
  manifest:
    mem_mb: "min(2000 * (2 ** (attempt - 1)), 8000)"
    runtime: "min(15 * (2 ** (attempt - 1)), 60)"
    threads: 1
  summary:
    mem_mb: "min(16000 * (2 ** (attempt - 1)), 64000)"
    runtime: "min(120 * (2 ** (attempt - 1)), 480)"
    threads: 1
    # Same as segment: tier derived from this rule's own runtime.
    slurm_partition: c
    qos: "('c_' + ('rapid' if min(120 * (2 ** (attempt - 1)), 480) <= 60 else 'short' if min(120 * (2 ** (attempt - 1)), 480) <= 480 else 'medium' if min(120 * (2 ** (attempt - 1)), 480) <= 2880 else 'long'))"

jobs: 100
keep-going: true
rerun-incomplete: true
scheduler: greedy
max-jobs-per-second: 10
max-status-checks-per-second: 10
restart-times: 1
local-cores: 1
latency-wait: 60
printshellcmds: true
