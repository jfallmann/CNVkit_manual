# =============================================================================
# config.yaml — CNVkit WGS Snakemake pipeline
# =============================================================================
# Edit paths and parameters for your environment.
# All output paths are absolute so the pipeline works regardless of the
# directory from which snakemake is invoked.

# ─── Project root ─────────────────────────────────────────────────────────────
# BAMs are expected at:
#   {project_dir}/preprocessing/recalibrated/{sample}/{sample}.recal.bam
# This is the standard nf-core/Sarek recalibrated BAM layout.
project_dir: "${PROJECT_DIR}"

# Pipeline output directory (absolute)
outdir: "${OUTPUT_DIR}/cnvkit_manual"

# ─── Reference files ─────────────────────────────────────────────────────────
fasta: "/resources/references/igenomes/Homo_sapiens/GATK/GRCh38/Sequence/WholeGenomeFasta/Homo_sapiens_assembly38.fasta"

# chr-prefixed hg38 refFlat gene annotation for cnvkit --annotate
# Download: wget -qO- https://hgdownload.soe.ucsc.edu/goldenPath/hg38/database/refFlat.txt.gz | gunzip > hg38.refFlat.txt
refflat: "${OUTPUT_DIR}/cnvkit_manual/reference/hg38.refFlat.txt"

# ─── Conda environment ────────────────────────────────────────────────────────
# Name of the existing conda environment containing CNVkit
conda_env: "cnvkit"

# ─── Normal (baseline) sample ─────────────────────────────────────────────────
# Used to build the matched-normal reference.
# All Bulk_sensitive_1..7 Sarek aliases share this exact BAM.
normal_sample: "Bulk_sensitive"

# ─── Sample registry ──────────────────────────────────────────────────────────
# 16 unique biological samples.
# Bulk_sensitive_1..7 are identical to Bulk_sensitive (same FASTQ) and are
# intentionally excluded — processing them would be redundant.
all_samples:
  - Bulk_sensitive
  - Bulk_resistant
  - BC1_naive
  - BC1_naive_1
  - BC3_naive
  - BC3_naive_1
  - BC217_naive
  - BC217_naive_1
  - BC217_resistant
  - BC217_resistant_1
  - BC139_naive
  - BC139_naive_1
  - BC139_resistant
  - BC139_resistant_1
  - BC1444_naive
  - BC1444_naive_1

# ─── Analysis: vs flat (theoretical) genome reference ─────────────────────────
# Every sample including Bulk_sensitive is analyzed here so you can see how
# the baseline itself deviates from a diploid genome.
vs_ref_samples:
  - Bulk_sensitive
  - Bulk_resistant
  - BC1_naive
  - BC1_naive_1
  - BC3_naive
  - BC3_naive_1
  - BC217_naive
  - BC217_naive_1
  - BC217_resistant
  - BC217_resistant_1
  - BC139_naive
  - BC139_naive_1
  - BC139_resistant
  - BC139_resistant_1
  - BC1444_naive
  - BC1444_naive_1

# ─── Analysis: vs Bulk_sensitive matched normal ────────────────────────────────
# Bulk_sensitive is the reference here; it is excluded from this list.
# Bulk_resistant is included (user-requested).
vs_normal_samples:
  - Bulk_resistant
  - BC1_naive
  - BC1_naive_1
  - BC3_naive
  - BC3_naive_1
  - BC217_naive
  - BC217_naive_1
  - BC217_resistant
  - BC217_resistant_1
  - BC139_naive
  - BC139_naive_1
  - BC139_resistant
  - BC139_resistant_1
  - BC1444_naive
  - BC1444_naive_1

# ─── CNVkit parameters ───────────────────────────────────────────────────────
cnvkit:
  method: "wgs"          # wgs = whole-genome sequencing (no capture target BED)
  min_mapq: 20           # minimum MAPQ for read counting in coverage
  segment_method: "cbs"  # segmentation: cbs | haar | flasso | hmm | hmm-tumor
  ploidy: 2              # assumed baseline ploidy for cnvkit call
  coverage_threads: 8    # parallel threads per coverage job (passed as -p)

  # Minimum gap between accessible regions for `cnvkit.py access` (-s).
  access_min_gap: 5000

  # BED files subtracted from the accessible genome (`cnvkit.py access -x`),
  # so blacklisted/unreliable regions are never binned.  Listed files must
  # exist before the run; set to [] to disable.
  # Download the ENCODE hg38 blacklist (chr-prefixed, matches assembly38):
  #   wget -qO- https://github.com/Boyle-Lab/Blacklist/raw/master/lists/hg38-blacklist.v2.bed.gz \
  #     | gunzip > ${OUTPUT_DIR}/cnvkit_manual/reference/hg38-blacklist.v2.bed
  access_exclude:
    - "${OUTPUT_DIR}/cnvkit_manual/reference/hg38-blacklist.v2.bed"

# ─── SLURM resources ─────────────────────────────────────────────────────────
# NOT configured here.  Per-rule memory / runtime / threads / partition / qos
# live in the snakemake profile, which is the only place the SLURM executor
# reads them from:
#
#     profiles/slurm/config.v8+.yaml   ->  set-resources:
#
# Edit that file to change job resources.
