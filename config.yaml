# =============================================================================
# config.yaml — CNVkit WGS Snakemake pipeline
# =============================================================================
# Edit paths and parameters for your environment.
# All output paths are absolute so the pipeline works regardless of the
# directory from which snakemake is invoked.

# ─── Project root ─────────────────────────────────────────────────────────────
# BAMs are expected at:
#   {project_dir}/preprocessing/recalibrated/{sample}/{sample}.recal.bam
# This is the standard nf-core/Sarek recalibrated BAM layout.
project_dir: "${PROJECT_DIR}"

# Pipeline output directory (absolute)
outdir: "${OUTPUT_DIR}/cnvkit_manual"

# ─── Reference files ─────────────────────────────────────────────────────────
fasta: "/resources/references/igenomes/Homo_sapiens/GATK/GRCh38/Sequence/WholeGenomeFasta/Homo_sapiens_assembly38.fasta"

# chr-prefixed hg38 refFlat gene annotation for cnvkit --annotate
# Download: wget -qO- https://hgdownload.soe.ucsc.edu/goldenPath/hg38/database/refFlat.txt.gz | gunzip > hg38.refFlat.txt
refflat: "${OUTPUT_DIR}/cnvkit_manual/reference/hg38.refFlat.txt"

# ─── Conda environment ────────────────────────────────────────────────────────
# Name of the existing conda environment containing CNVkit
conda_env: "cnvkit"

# ─── Normal (baseline) sample ─────────────────────────────────────────────────
# Used to build the matched-normal reference.
# All Bulk_sensitive_1..7 Sarek aliases share this exact BAM.
normal_sample: "Bulk_sensitive"

# ─── Sample registry ──────────────────────────────────────────────────────────
# 9 unique biological samples.
# The *_1 names (and Bulk_sensitive_1..7) are Sarek somatic-pairing aliases:
# they map to the same FASTQ and produce identical BAMs, so they are excluded.
all_samples:
  - Bulk_sensitive
  - Bulk_resistant
  - BC1_naive
  - BC3_naive
  - BC217_naive
  - BC217_resistant
  - BC139_naive
  - BC139_resistant
  - BC1444_naive

# ─── Analysis: vs flat (theoretical) genome reference ─────────────────────────
# Every sample including Bulk_sensitive is analyzed here so you can see how
# the baseline itself deviates from a diploid genome.
vs_ref_samples:
  - Bulk_sensitive
  - Bulk_resistant
  - BC1_naive
  - BC3_naive
  - BC217_naive
  - BC217_resistant
  - BC139_naive
  - BC139_resistant
  - BC1444_naive

# ─── Analysis: vs Bulk_sensitive matched normal ────────────────────────────────
# Bulk_sensitive is the reference here; it is excluded from this list.
# Bulk_resistant is included (user-requested).
vs_normal_samples:
  - Bulk_resistant
  - BC1_naive
  - BC3_naive
  - BC217_naive
  - BC217_resistant
  - BC139_naive
  - BC139_resistant
  - BC1444_naive

# ─── CNVkit parameters ───────────────────────────────────────────────────────
cnvkit:
  method: "wgs"          # wgs = whole-genome sequencing (no capture target BED)
  min_mapq: 20           # minimum MAPQ for read counting in coverage
  segment_method: "cbs"  # segmentation: cbs | haar | flasso | hmm | hmm-tumor
  coverage_threads: 8    # parallel threads per coverage job (passed as -p)

  # ── cnvkit call: tumour ploidy / purity ────────────────────────────────────
  # NOT estimated by the pipeline.  These are the GLOBAL fallback values used
  # for every (mode, sample) comparison that has no entry (or no matching key)
  # in comparison_overrides below.  ploidy defaults to 2 (CNVkit's own
  # default) so it is always passed explicitly to `cnvkit call` and always
  # has a defined value to threshold absolute copy number against.
  ploidy: 2
  purity: null

  # ── Per-mode ploidy / purity defaults ──────────────────────────────────────
  # Applies to every sample analyzed in that mode, overriding the global
  # ploidy/purity above. Typical case: vs_reference compares against the flat
  # (diploid) theoretical genome, while vs_normal compares against the actual
  # matched-normal sample, which may itself carry a different ploidy (e.g.
  # near-triploid) — so the two modes need different baselines even for the
  # very same tumour sample.
  mode_defaults:
    vs_reference:
      ploidy: 2
    vs_normal:
      ploidy: 3

  # ── Per-comparison ploidy / purity overrides ───────────────────────────────
  # Keyed by sample name, for exceptions beyond the mode_defaults above.
  # Two levels of specificity, most specific wins:
  #   1. comparison_overrides.<sample>.ploidy/purity
  #        -> applies to that sample in BOTH modes.
  #   2. comparison_overrides.<sample>.<mode>.ploidy/purity
  #        -> applies only to that (mode, sample) comparison; overrides #1.
  # Precedence overall (highest to lowest):
  #   comparison_overrides.<sample>.<mode>
  #   > comparison_overrides.<sample>          (flat, both modes)
  #   > mode_defaults.<mode>
  #   > global ploidy/purity above
  #
  # Example: BC1444_naive matches the vs_normal default (ploidy 3) but should
  # be treated as diploid vs the flat reference:
  #
  # comparison_overrides:
  #   BC1444_naive:
  #     vs_reference:
  #       ploidy: 2
  comparison_overrides: {}

  # ── Chromosome filtering ───────────────────────────────────────────────────
  # Chromosomes dropped from the accessible genome, hence from every bin and
  # every downstream result.  Non-canonical contigs (*_random, chrUn_*, *_alt,
  # chrEBV, chrM) are always dropped.  chrY is noise in female samples and
  # largely unmappable; add "chrX" here to drop X as well.
  drop_chr: ["chrY"]

  # ── Amplified / deleted gene lists ──────────────────────────────────────
  # Based on ABSOLUTE copy number (cn, from `cnvkit call`), not log2 ratio, so
  # the cutoff automatically follows each comparison's resolved ploidy
  # (global / mode_defaults / comparison_overrides above):
  #   amp_cutoff = round(ploidy) + amp_offset   -> amplified if cn >= amp_cutoff
  #   del_cutoff = max(round(ploidy) - del_offset, 0) -> deleted if cn <= del_cutoff
  # Defaults (offset 1/1) reproduce the old diploid intent: ploidy 2 =>
  # amplified >= 3 copies, deleted <= 1 copy. For ploidy 3 this instead means
  # amplified >= 4 copies, deleted <= 2 copies.
  genelist:
    amp_offset: 1
    del_offset: 1
    min_probes: 5        # ignore genes covered by fewer bins

  # Minimum gap between accessible regions for `cnvkit.py access` (-s).
  access_min_gap: 5000

  # BED files subtracted from the accessible genome (`cnvkit.py access -x`),
  # so blacklisted/unreliable regions are never binned.  Listed files must
  # exist before the run; set to [] to disable.
  # Download the ENCODE hg38 blacklist (chr-prefixed, matches assembly38):
  #   wget -qO- https://github.com/Boyle-Lab/Blacklist/raw/master/lists/hg38-blacklist.v2.bed.gz \
  #     | gunzip > ${OUTPUT_DIR}/cnvkit_manual/reference/hg38-blacklist.v2.bed
  access_exclude:
    - "${OUTPUT_DIR}/cnvkit_manual/reference/hg38-blacklist.v2.bed"

# ─── SLURM resources ─────────────────────────────────────────────────────────
# NOT configured here.  Per-rule memory / runtime / threads / partition / qos
# live in the snakemake profile, which is the only place the SLURM executor
# reads them from:
#
#     profiles/slurm/config.v8+.yaml   ->  set-resources:
#
# Edit that file to change job resources.
