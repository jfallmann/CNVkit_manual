# =============================================================================
# config.yaml — CNVkit WGS Snakemake pipeline
# =============================================================================
# Edit paths and parameters for your environment.
# All output paths are absolute so the pipeline works regardless of the
# directory from which snakemake is invoked.

# ─── Project root ─────────────────────────────────────────────────────────────
# BAMs are expected at:
#   {project_dir}/preprocessing/recalibrated/{sample}/{sample}.recal.bam
# This is the standard nf-core/Sarek recalibrated BAM layout.
project_dir: "${PROJECT_DIR}"

# Pipeline output directory (absolute)
outdir: "${OUTPUT_DIR}/cnvkit_manual"

# ─── Reference files ─────────────────────────────────────────────────────────
fasta: "/resources/references/igenomes/Homo_sapiens/GATK/GRCh38/Sequence/WholeGenomeFasta/Homo_sapiens_assembly38.fasta"

# chr-prefixed hg38 refFlat gene annotation for cnvkit --annotate
# Download: wget -qO- https://hgdownload.soe.ucsc.edu/goldenPath/hg38/database/refFlat.txt.gz | gunzip > hg38.refFlat.txt
refflat: "${OUTPUT_DIR}/cnvkit_manual/reference/hg38.refFlat.txt"

# ─── Conda environment ────────────────────────────────────────────────────────
# Name of the existing conda environment containing CNVkit
conda_env: "cnvkit"

# ─── Normal (baseline) sample ─────────────────────────────────────────────────
# Used to build the matched-normal reference.
# All Bulk_sensitive_1..7 Sarek aliases share this exact BAM.
normal_sample: "Bulk_sensitive"

# ─── Sample registry ──────────────────────────────────────────────────────────
# 16 unique biological samples.
# Bulk_sensitive_1..7 are identical to Bulk_sensitive (same FASTQ) and are
# intentionally excluded — processing them would be redundant.
all_samples:
  - Bulk_sensitive
  - Bulk_resistant
  - BC1_naive
  - BC1_naive_1
  - BC3_naive
  - BC3_naive_1
  - BC217_naive
  - BC217_naive_1
  - BC217_resistant
  - BC217_resistant_1
  - BC139_naive
  - BC139_naive_1
  - BC139_resistant
  - BC139_resistant_1
  - BC1444_naive
  - BC1444_naive_1

# ─── Analysis: vs flat (theoretical) genome reference ─────────────────────────
# Every sample including Bulk_sensitive is analyzed here so you can see how
# the baseline itself deviates from a diploid genome.
vs_ref_samples:
  - Bulk_sensitive
  - Bulk_resistant
  - BC1_naive
  - BC1_naive_1
  - BC3_naive
  - BC3_naive_1
  - BC217_naive
  - BC217_naive_1
  - BC217_resistant
  - BC217_resistant_1
  - BC139_naive
  - BC139_naive_1
  - BC139_resistant
  - BC139_resistant_1
  - BC1444_naive
  - BC1444_naive_1

# ─── Analysis: vs Bulk_sensitive matched normal ────────────────────────────────
# Bulk_sensitive is the reference here; it is excluded from this list.
# Bulk_resistant is included (user-requested).
vs_normal_samples:
  - Bulk_resistant
  - BC1_naive
  - BC1_naive_1
  - BC3_naive
  - BC3_naive_1
  - BC217_naive
  - BC217_naive_1
  - BC217_resistant
  - BC217_resistant_1
  - BC139_naive
  - BC139_naive_1
  - BC139_resistant
  - BC139_resistant_1
  - BC1444_naive
  - BC1444_naive_1

# ─── CNVkit parameters ───────────────────────────────────────────────────────
cnvkit:
  method: "wgs"          # wgs = whole-genome sequencing (no capture target BED)
  min_mapq: 20           # minimum MAPQ for read counting in coverage
  segment_method: "cbs"  # segmentation: cbs | haar | flasso | hmm | hmm-tumor
  ploidy: 2              # assumed baseline ploidy for cnvkit call
  coverage_threads: 8    # parallel threads per coverage job (passed as -p)

  # Minimum gap between accessible regions for `cnvkit.py access` (-s).
  access_min_gap: 5000

  # BED files subtracted from the accessible genome (`cnvkit.py access -x`),
  # so blacklisted/unreliable regions are never binned.  Listed files must
  # exist before the run; set to [] to disable.
  # Download the ENCODE hg38 blacklist (chr-prefixed, matches assembly38):
  #   wget -qO- https://github.com/Boyle-Lab/Blacklist/raw/master/lists/hg38-blacklist.v2.bed.gz \
  #     | gunzip > ${OUTPUT_DIR}/cnvkit_manual/reference/hg38-blacklist.v2.bed
  access_exclude:
    - "${OUTPUT_DIR}/cnvkit_manual/reference/hg38-blacklist.v2.bed"

# ─── SLURM resources ─────────────────────────────────────────────────────────
# Forwarded to the SLURM executor via Snakemake's resources: directive.
# Values are expressions evaluated per job attempt, so a job that fails gets
# resubmitted with doubled memory/runtime up to the given cap:
#     min(BASE * (2 ** (attempt - 1)), CAP)
# runtime is in minutes.  partition/qos are derived from the same runtime
# expression, using this cluster's CPU partitions (short <=1440 min,
# medium <=2880 min, long above).
slurm:
  access:
    mem_mb: "min(8000 * (2 ** (attempt - 1)), 32000)"
    runtime: "min(60 * (2 ** (attempt - 1)), 240)"
    threads: 1
    partition: "('c_long' if min(60 * (2 ** (attempt - 1)), 240) > 2880 else 'c_medium' if min(60 * (2 ** (attempt - 1)), 240) > 1440 else 'c')"
    qos: "('long' if min(60 * (2 ** (attempt - 1)), 240) > 2880 else 'medium' if min(60 * (2 ** (attempt - 1)), 240) > 1440 else 'short')"

  autobin:
    mem_mb: "min(16000 * (2 ** (attempt - 1)), 64000)"
    runtime: "min(60 * (2 ** (attempt - 1)), 240)"
    threads: 1
    partition: "('c_long' if min(60 * (2 ** (attempt - 1)), 240) > 2880 else 'c_medium' if min(60 * (2 ** (attempt - 1)), 240) > 1440 else 'c')"
    qos: "('long' if min(60 * (2 ** (attempt - 1)), 240) > 2880 else 'medium' if min(60 * (2 ** (attempt - 1)), 240) > 1440 else 'short')"

  coverage:
    mem_mb: "min(32000 * (2 ** (attempt - 1)), 120000)"
    runtime: "min(360 * (2 ** (attempt - 1)), 1440)"
    threads: 8
    partition: "('c_long' if min(360 * (2 ** (attempt - 1)), 1440) > 2880 else 'c_medium' if min(360 * (2 ** (attempt - 1)), 1440) > 1440 else 'c')"
    qos: "('long' if min(360 * (2 ** (attempt - 1)), 1440) > 2880 else 'medium' if min(360 * (2 ** (attempt - 1)), 1440) > 1440 else 'short')"

  reference:
    mem_mb: "min(16000 * (2 ** (attempt - 1)), 64000)"
    runtime: "min(60 * (2 ** (attempt - 1)), 240)"
    threads: 1
    partition: "('c_long' if min(60 * (2 ** (attempt - 1)), 240) > 2880 else 'c_medium' if min(60 * (2 ** (attempt - 1)), 240) > 1440 else 'c')"
    qos: "('long' if min(60 * (2 ** (attempt - 1)), 240) > 2880 else 'medium' if min(60 * (2 ** (attempt - 1)), 240) > 1440 else 'short')"

  fix:
    mem_mb: "min(8000 * (2 ** (attempt - 1)), 32000)"
    runtime: "min(30 * (2 ** (attempt - 1)), 120)"
    threads: 1
    partition: "('c_long' if min(30 * (2 ** (attempt - 1)), 120) > 2880 else 'c_medium' if min(30 * (2 ** (attempt - 1)), 120) > 1440 else 'c')"
    qos: "('long' if min(30 * (2 ** (attempt - 1)), 120) > 2880 else 'medium' if min(30 * (2 ** (attempt - 1)), 120) > 1440 else 'short')"

  segment:
    mem_mb: "min(16000 * (2 ** (attempt - 1)), 64000)"
    runtime: "min(120 * (2 ** (attempt - 1)), 480)"
    threads: 1
    partition: "('c_long' if min(120 * (2 ** (attempt - 1)), 480) > 2880 else 'c_medium' if min(120 * (2 ** (attempt - 1)), 480) > 1440 else 'c')"
    qos: "('long' if min(120 * (2 ** (attempt - 1)), 480) > 2880 else 'medium' if min(120 * (2 ** (attempt - 1)), 480) > 1440 else 'short')"

  call:
    mem_mb: "min(4000 * (2 ** (attempt - 1)), 16000)"
    runtime: "min(30 * (2 ** (attempt - 1)), 120)"
    threads: 1
    partition: "('c_long' if min(30 * (2 ** (attempt - 1)), 120) > 2880 else 'c_medium' if min(30 * (2 ** (attempt - 1)), 120) > 1440 else 'c')"
    qos: "('long' if min(30 * (2 ** (attempt - 1)), 120) > 2880 else 'medium' if min(30 * (2 ** (attempt - 1)), 120) > 1440 else 'short')"

  genemetrics:
    mem_mb: "min(4000 * (2 ** (attempt - 1)), 16000)"
    runtime: "min(30 * (2 ** (attempt - 1)), 120)"
    threads: 1
    partition: "('c_long' if min(30 * (2 ** (attempt - 1)), 120) > 2880 else 'c_medium' if min(30 * (2 ** (attempt - 1)), 120) > 1440 else 'c')"
    qos: "('long' if min(30 * (2 ** (attempt - 1)), 120) > 2880 else 'medium' if min(30 * (2 ** (attempt - 1)), 120) > 1440 else 'short')"

  scatter:
    mem_mb: "min(8000 * (2 ** (attempt - 1)), 32000)"
    runtime: "min(60 * (2 ** (attempt - 1)), 240)"
    threads: 1
    partition: "('c_long' if min(60 * (2 ** (attempt - 1)), 240) > 2880 else 'c_medium' if min(60 * (2 ** (attempt - 1)), 240) > 1440 else 'c')"
    qos: "('long' if min(60 * (2 ** (attempt - 1)), 240) > 2880 else 'medium' if min(60 * (2 ** (attempt - 1)), 240) > 1440 else 'short')"

  diagram:
    mem_mb: "min(8000 * (2 ** (attempt - 1)), 32000)"
    runtime: "min(60 * (2 ** (attempt - 1)), 240)"
    threads: 1
    partition: "('c_long' if min(60 * (2 ** (attempt - 1)), 240) > 2880 else 'c_medium' if min(60 * (2 ** (attempt - 1)), 240) > 1440 else 'c')"
    qos: "('long' if min(60 * (2 ** (attempt - 1)), 240) > 2880 else 'medium' if min(60 * (2 ** (attempt - 1)), 240) > 1440 else 'short')"

  heatmap:
    mem_mb: "min(16000 * (2 ** (attempt - 1)), 64000)"
    runtime: "min(60 * (2 ** (attempt - 1)), 240)"
    threads: 1
    partition: "('c_long' if min(60 * (2 ** (attempt - 1)), 240) > 2880 else 'c_medium' if min(60 * (2 ** (attempt - 1)), 240) > 1440 else 'c')"
    qos: "('long' if min(60 * (2 ** (attempt - 1)), 240) > 2880 else 'medium' if min(60 * (2 ** (attempt - 1)), 240) > 1440 else 'short')"
